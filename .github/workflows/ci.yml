name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # macos-26 is the arm64 image whose default Xcode is 26.6 (runner-images,
  # images/macos/macos-26-arm64-Readme.md). build.sh compiles the Icon Composer
  # .icon document with actool, which needs Xcode 26, and -default-isolation
  # needs Swift 6.1. Pinned by path so an image update can't change the compiler.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  CARGO_TERM_COLOR: always

jobs:
  engine:
    name: Rust engine
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --features cli -- -D warnings
      - run: cargo test --locked --release
      - run: cargo test --locked --release --features cli
      # Cargo.toml defines no `default` feature, so this is the same build as
      # the plain run above; it is kept because docs/AGENT_API.md prescribes
      # it and it stays meaningful if a default feature is ever added.
      - run: cargo test --locked --release --no-default-features
      - run: cargo build --locked --release

  cli:
    name: CLI tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --locked --release --features cli --bin blitztree
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  swift-checks:
    name: Swift checks
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: xcodebuild -version && swiftc --version
      # Builds the engine, then compiles and runs every Swift check against
      # disposable fixtures (VolumeChecks makes exFAT disk images with hdiutil).
      - run: tests/run-cleanup.sh

  swift-build:
    name: Swift app build
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: xcodebuild -version && swiftc --version
      - run: ./build.sh
      # actool wrote the Liquid Glass icon (Assets.car) and the flat .icns.
      - run: test -f build/BlitzTree.app/Contents/Resources/Assets.car -a -f build/BlitzTree.app/Contents/Resources/AppIcon.icns
      - run: codesign --verify --deep --strict build/BlitzTree.app

  benchmarks:
    name: Benchmark runners
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # rendering.py compares against an older commit
      - run: xcodebuild -version && swiftc --version
      # Fails when app/bz.h declares a function a fixture doesn't define.
      - run: benchmarks/check-fixtures.sh
      # Output equality only, no timing: correctness regressions in the
      # offline runners and the rendering paths.
      - run: benchmarks/run-ui.sh --check-only
      - run: benchmarks/run-agent.sh --check-only
      - run: python3 benchmarks/rendering.py --baseline bf3b1fc --check-only
      - run: python3 benchmarks/model-handoff.py
